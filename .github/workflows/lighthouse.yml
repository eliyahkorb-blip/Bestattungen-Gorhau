name: Lighthouse CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI (Startseite + wichtige Seitentypen)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./lighthouserc.json
        # Ergebnis (inkl. temporär öffentlichem Report-Link) erscheint im Job-Log.
        # Accessibility ist als Fehlerschwelle (minScore 1) gesetzt; Performance/SEO als Warnung.
