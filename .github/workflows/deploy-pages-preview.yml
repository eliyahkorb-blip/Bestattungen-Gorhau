name: Deploy GitHub Pages preview

# Öffentliche, nicht indexierbare Vorschau der Website unter
# https://eliyahkorb-blip.github.io/Bestattungen-Gorhau/
#
# Deployt IMMER den GitHub-Pages-Build (DEPLOY_TARGET=github-pages), niemals den
# Produktionsbuild. Die Produktionsdomain https://www.gorhau-bestattungen.de/ wird über einen
# separaten Hosting-Weg befüllt (siehe docs/DEPLOYMENT.md) und ist von diesem Workflow nicht
# betroffen. Kein Merge nach main erforderlich – der Workflow läuft direkt auf diesem Branch.

on:
  push:
    branches:
      - claude/gorhau-bestattungen-relaunch-jmpxkg
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-weit gesetzt, damit die Variable garantiert auch den von withastro/action intern
    # aufgerufenen Build-Prozess erreicht (astro.config.mjs liest process.env.DEPLOY_TARGET).
    env:
      DEPLOY_TARGET: github-pages
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Astro installieren und bauen (GitHub-Pages-Ziel)
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
